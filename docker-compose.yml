version: "3.9"

volumes:
  HNG-nginx-logs:
    driver: local
  nextcloud-data:
    driver: local

networks:
  hng-network:
    driver: bridge

services:
  nextcloud:
    image: kefaslungu/hng-nextcloud
    container_name: nextcloud
    restart: always
    volumes:
      - nextcloud-data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro
    networks:
      - hng-network
    environment:
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx
      - ./logs:/var/log/nginx/host
    networks:
      - hng-network
    depends_on:
      - nextcloud
