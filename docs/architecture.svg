<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0a0a0a"/>
  
  <!-- Boxes -->
  <rect x="30" y="200" width="120" height="50" rx="4" fill="#111" stroke="#333"/>
  <text x="90" y="230" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Internet</text>

  <rect x="200" y="200" width="120" height="50" rx="4" fill="#111" stroke="#fff"/>
  <text x="260" y="225" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Nginx</text>
  <text x="260" y="240" text-anchor="middle" fill="#666" font-family="monospace" font-size="10">JSON logs</text>

  <rect x="370" y="200" width="120" height="50" rx="4" fill="#111" stroke="#333"/>
  <text x="430" y="225" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Nextcloud</text>
  <text x="430" y="240" text-anchor="middle" fill="#666" font-family="monospace" font-size="10">kefaslungu</text>

  <rect x="200" y="340" width="120" height="50" rx="4" fill="#111" stroke="#4ade80"/>
  <text x="260" y="365" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="12">Detector</text>
  <text x="260" y="380" text-anchor="middle" fill="#666" font-family="monospace" font-size="10">daemon</text>

  <rect x="30" y="340" width="120" height="50" rx="4" fill="#111" stroke="#333"/>
  <text x="90" y="365" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">iptables</text>
  <text x="90" y="380" text-anchor="middle" fill="#666" font-family="monospace" font-size="10">block IP</text>

  <rect x="370" y="340" width="120" height="50" rx="4" fill="#111" stroke="#333"/>
  <text x="430" y="365" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Slack</text>
  <text x="430" y="380" text-anchor="middle" fill="#666" font-family="monospace" font-size="10">alerts</text>

  <rect x="540" y="340" width="120" height="50" rx="4" fill="#111" stroke="#333"/>
  <text x="600" y="365" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">Dashboard</text>
  <text x="600" y="380" text-anchor="middle" fill="#666" font-family="monospace" font-size="10">port 8080</text>

  <rect x="200" y="80" width="120" height="50" rx="4" fill="#111" stroke="#333"/>
  <text x="260" y="105" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">HNG-nginx</text>
  <text x="260" y="120" text-anchor="middle" fill="#666" font-family="monospace" font-size="10">-logs volume</text>

  <!-- Arrows -->
  <line x1="150" y1="225" x2="200" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="225" x2="370" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="200" x2="260" y2="130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="130" x2="260" y2="340" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-green)"/>
  <line x1="200" y1="365" x2="150" y2="365" stroke="#ff4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="320" y1="365" x2="370" y2="365" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="340" x2="430" y2="250" stroke="#555" stroke-width="1" stroke-dasharray="3"/>
  <line x1="320" y1="380" x2="540" y2="380" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="260" y="170" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">writes logs</text>
  <text x="260" y="310" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10">reads logs</text>
  <text x="170" y="355" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="10">DROP</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="460" text-anchor="middle" fill="#444" font-family="monospace" font-size="11">HNG Stage 3 — Anomaly Detection Architecture</text>
</svg>
